apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: application-ci
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL

    - name: revision
      type: string
      default: main
      description: Git revision to build

    - name: maven-goals
      type: string
      default: "clean package"
      description: Maven goals

    - name: image-repository
      type: string
      description: Target container image repository

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build
      runAfter:
        - clone
      taskRef:
        name: maven-build
      params:
        - name: goals
          value: $(params.maven-goals)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      runAfter:
        - build
      taskRef:
        name: unit-test
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-image
      runAfter:
        - test

      taskRef:
        name: kaniko

      params:
        - name: image
          value: "$(params.image-repository):$(tasks.clone.results.commit)"

        - name: dockerfile
          value: "Dockerfile"

        - name: context
          value: "."

      workspaces:
        - name: source
          workspace: shared-workspace
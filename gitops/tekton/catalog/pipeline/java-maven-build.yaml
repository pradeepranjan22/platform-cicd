apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: java-maven-build
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL

    - name: revision
      type: string
      default: main
      description: Git revision

    - name: maven-goals
      type: string
      default: clean package

    - name: image-repository
      type: string
      description: Target image repository

    - name: sonar-project-key
      type: string
      description: SonarQube project key

    - name: sonar-host-url
      type: string
      default: https://sonarcloud.io

    - name: sonar-organization
      type: string
      default: ""

  workspaces:
    - name: shared-workspace

  tasks:

    # -------------------------------------------------
    # 1. Clone
    # -------------------------------------------------
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: tekton-platform

      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 2. SonarQube
    # -------------------------------------------------
    - name: code-quality
      runAfter:
        - clone

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: sonarqube-analysis
          - name: namespace
            value: tekton-platform

      params:
        - name: project-key
          value: $(params.sonar-project-key)
        - name: host-url
          value: $(params.sonar-host-url)
        - name: organization
          value: $(params.sonar-organization)

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 3. Dependency Scan
    # -------------------------------------------------
    - name: dependency-scan
      runAfter:
        - clone

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: trivy-fs-scan
          - name: namespace
            value: tekton-platform

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 4. Secret Scan
    # -------------------------------------------------
    - name: secret-scan
      runAfter:
        - clone

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: trivy-secret-scan
          - name: namespace
            value: tekton-platform

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 5. Maven Build
    # -------------------------------------------------
    - name: build
      runAfter:
        - code-quality
        - dependency-scan
        - secret-scan

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: maven-build
          - name: namespace
            value: tekton-platform

      params:
        - name: goals
          value: $(params.maven-goals)

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 6. Unit Test
    # -------------------------------------------------
    - name: test
      runAfter:
        - build

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: unit-test
          - name: namespace
            value: tekton-platform

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 7. Build Image
    # -------------------------------------------------
    - name: build-image
      runAfter:
        - test

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: tekton-platform

      params:
        - name: image
          value: $(params.image-repository):$(tasks.clone.results.commit)
        - name: dockerfile
          value: Dockerfile
        - name: context
          value: .

      workspaces:
        - name: source
          workspace: shared-workspace

    # -------------------------------------------------
    # 8. Image Scan
    # -------------------------------------------------
    - name: image-scan
      runAfter:
        - build-image

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: trivy-image-scan
          - name: namespace
            value: tekton-platform

      params:
        - name: image
          value: $(params.image-repository):$(tasks.clone.results.commit)
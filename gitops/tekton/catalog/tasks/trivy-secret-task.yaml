apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-secret-scan

spec:
  workspaces:
    - name: source
      description: Workspace containing application source code

  steps:
    - name: scan
      image: aquasec/trivy:0.74.0
      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "========================================"
        echo "Trivy Secret Scan"
        echo "========================================"

        echo "Workspace:"
        pwd

        echo "Scanning source for exposed secrets..."

        trivy fs \
          --scanners secret \
          --exit-code 1 \
          .

        echo "========================================"
        echo "Trivy secret scan passed"
        echo "No exposed secrets detected"
        echo "========================================"
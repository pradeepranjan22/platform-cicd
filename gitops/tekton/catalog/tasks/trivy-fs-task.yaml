apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-fs-scan

spec:
  params:
    - name: severity
      type: string
      default: HIGH,CRITICAL
      description: Vulnerability severities that fail the CI gate

  workspaces:
    - name: source
      description: Workspace containing application source code

  steps:
    - name: scan
      image: aquasec/trivy:0.74.0
      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "========================================"
        echo "Trivy Filesystem / SCA Scan"
        echo "========================================"

        echo "Workspace:"
        pwd

        echo "Scanning for:"
        echo "$(params.severity)"

        trivy fs \
          --scanners vuln \
          --severity "$(params.severity)" \
          --exit-code 1 \
          .

        echo "========================================"
        echo "Trivy SCA scan passed"
        echo "========================================"
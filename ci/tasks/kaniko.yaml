apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko
spec:
  params:
    - name: image
      type: string
      description: Full target container image reference

    - name: dockerfile
      type: string
      default: Dockerfile

    - name: context
      type: string
      default: "."

  workspaces:
    - name: source
      description: Application source and Maven build output

  volumes:
    - name: docker-config
      secret:
        secretName: dockerhub-secret
        items:
          - key: .dockerconfigjson
            path: config.json

  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      workingDir: $(workspaces.source.path)
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --snapshot-mode=redo
        - --use-new-run
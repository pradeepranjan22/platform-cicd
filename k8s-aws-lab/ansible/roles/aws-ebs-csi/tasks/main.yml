---
- name: Check whether Helm is installed
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3
    mode: "0755"
  when: helm_check.rc != 0

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get-helm-3
  when: helm_check.rc != 0

- name: Verify Helm installation
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_version
  changed_when: false

- name: Display Helm version
  ansible.builtin.debug:
    var: helm_version.stdout

- name: Add AWS EBS CSI Helm repository
  kubernetes.core.helm_repository:
    name: "{{ ebs_csi_helm_repo_name }}"
    repo_url: "{{ ebs_csi_helm_repo_url }}"

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Install or upgrade AWS EBS CSI Driver
  kubernetes.core.helm:
    name: "{{ ebs_csi_release_name }}"
    chart_ref: "{{ ebs_csi_helm_repo_name }}/aws-ebs-csi-driver"
    chart_version: "{{ ebs_csi_chart_version }}"
    release_namespace: "{{ ebs_csi_namespace }}"
    create_namespace: false
    wait: true
    values:
      controller:
        region: "{{ aws_region }}"
      node:
        tolerateAllTaints: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for EBS CSI controller
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ ebs_csi_namespace }}
      rollout status deployment/ebs-csi-controller
      --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Wait for EBS CSI node daemonset
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ ebs_csi_namespace }}
      rollout status daemonset/ebs-csi-node
      --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Create EBS gp3 StorageClass
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'storageclass.yaml.j2') | from_yaml }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Verify EBS CSI driver
  ansible.builtin.command:
    cmd: kubectl get csidriver ebs.csi.aws.com
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ebs_csi_driver
  changed_when: false

- name: Display EBS CSI driver
  ansible.builtin.debug:
    var: ebs_csi_driver.stdout_lines

- name: Get EBS CSI pods
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ ebs_csi_namespace }}
      get pods -l app.kubernetes.io/name=aws-ebs-csi-driver -o wide
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ebs_csi_pods
  changed_when: false

- name: Display EBS CSI pods
  ansible.builtin.debug:
    var: ebs_csi_pods.stdout_lines

- name: Get EBS StorageClass
  ansible.builtin.command:
    cmd: kubectl get storageclass {{ ebs_csi_storage_class_name }} -o yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ebs_storageclass
  changed_when: false

- name: Display EBS StorageClass
  ansible.builtin.debug:
    var: ebs_storageclass.stdout_lines
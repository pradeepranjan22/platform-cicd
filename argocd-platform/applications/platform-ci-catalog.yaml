  resource "kubernetes_manifest" "platform_ci_catalog" {
    manifest = {
    apiVersion = "argoproj.io/v1alpha1"
    kind       = "Application"

    metadata = {
    name      = "platform-ci-catalog"
    namespace = "argocd"
    }

    spec = {
    project = "platform"
    
    source = {
    repoURL        = "https://github.com/pradeepranjan22/platform-cicd.git"
    targetRevision = "main"
    path           = "gitops/tekton/catalog"
    }
    
    destination = {
    server    = "https://kubernetes.default.svc"
    namespace = "tekton-platform"
    }
    
    syncPolicy = {
    syncOptions = [
    "CreateNamespace=false"
    ]
    }
    }
    }
    
    depends_on = [
    kubernetes_manifest.platform_project
    ]
  }
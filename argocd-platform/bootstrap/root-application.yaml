apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: platform

  source:
    repoURL: https://github.com/<GITHUB_ORG>/lab-10-12-terraform-eks.git
    targetRevision: main
    path: argocd-platform/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
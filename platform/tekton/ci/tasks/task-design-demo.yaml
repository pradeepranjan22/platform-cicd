apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: task-design-demo
spec:
  params:
    - name: message
      type: string
      default: "Tekton Task"

  workspaces:
    - name: source

  results:
    - name: generated-value
      description: Value generated by the Task

  steps:
    - name: write-file
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "$(params.message)" > $(workspaces.source.path)/message.txt

    - name: read-file-and-result
      image: alpine:3.20
      script: |
        #!/bin/sh
        cat $(workspaces.source.path)/message.txt
        echo "task-completed" > $(results.generated-value.path)
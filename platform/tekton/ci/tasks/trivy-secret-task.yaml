apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-secret-scan
spec:
  workspaces:
    - name: source
  steps:
    - name: scan
      image: aquasec/trivy:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "========================================"
        echo "Trivy Secret Scan"
        echo "========================================"

        trivy fs \
          --scanners secret \
          --exit-code 1 \
          .

        echo "Trivy secret scan passed"
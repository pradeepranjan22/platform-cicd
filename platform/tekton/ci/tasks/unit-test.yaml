apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test

spec:
  workspaces:
    - name: source
      description: Workspace containing application source code

  steps:
    - name: test
      image: maven:3.9-eclipse-temurin-21
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Files:"
        ls -la

        mvn test